<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mermaid Snap ワークベンチ</title>
<style>
:root {
  --bg: #eef1f4; --panel: #ffffff; --fg: #1d2430; --muted: #5d6878; --line: #d5dbe3;
  --accent: #1f6feb; --accent-fg: #ffffff; --ok: #2f8f5b; --warn: #b26a00; --bad: #a4161a; --sel: #e7f0ff;
  --font-ui: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161a20; --panel: #1f242c; --fg: #e5e9ef; --muted: #9aa5b4; --line: #333b47; --accent: #4c8dff; --accent-fg: #0b1220; --ok: #5fcf8e; --warn: #f0b45a; --bad: #ffb3b3; --sel: #233148; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.5 var(--font-ui); display: grid; grid-template-columns: 320px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
/* サイドバーは、コード欄と同じく細い帯に折りたたむ（aside を消すと main が左の列に入ってしまうので、帯は残す） */
body.side-closed { grid-template-columns: 40px minmax(0, 1fr); }
body.side-closed aside > :not(.side-expand) { display: none !important; }
.side-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.side-head button { padding: 2px 8px; font-size: 12px; }
.side-expand { display: none; }
body.side-closed .side-expand {
  display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1;
  border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 12px 0; font-size: 12px;
}
body.side-closed .side-expand span { writing-mode: vertical-rl; letter-spacing: .2em; }
body.side-closed .side-expand:hover { color: var(--accent); }
button, select, input { font: inherit; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 5px 10px; }
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd { font-size: 11px; opacity: .75; margin-left: 4px; }

header { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 14px; margin: 0; white-space: nowrap; }
.where { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.where .file { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.where .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.branch { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; white-space: nowrap; }
.nav { display: flex; gap: 6px; align-items: center; }
#msg { font-size: 12px; min-width: 10em; text-align: right; color: var(--muted); }
#msg.ok { color: var(--ok); } #msg.bad { color: var(--bad); } #msg.warn { color: var(--warn); }

aside { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
.filters { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); }
.filters .row { display: flex; gap: 6px; }
.filters input { flex: 1; min-width: 0; }
.count { font-size: 12px; color: var(--muted); }
#tree { flex: 1; overflow: auto; padding: 4px 0 16px; }
details { margin: 0; }
summary { cursor: pointer; padding: 3px 8px; list-style-position: inside; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
summary:hover { background: var(--sel); }
details.dir > summary { font-weight: 700; }
summary .n { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 4px; }
.item { display: flex; gap: 6px; align-items: baseline; width: 100%; text-align: left; border: 0; border-radius: 0; background: transparent; padding: 3px 8px 3px 40px; }
.item:hover { background: var(--sel); }
.item[aria-current="true"] { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
.item .mark { width: 1.2em; flex: none; text-align: center; }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mark.saved { color: var(--ok); } .mark.png { color: var(--muted); } .mark.none { color: var(--line); } .mark.dirty { color: var(--warn); }

main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.notice { display: none; padding: 6px 12px; font-size: 12px; background: #fff4e0; color: #6b4300; border-bottom: 1px solid var(--line); }
.notice.show { display: block; }
iframe { flex: 1; width: 100%; border: 0; min-height: 0; background: var(--bg); }
.empty { margin: auto; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Mermaid Snap ワークベンチ</h1>
  <span class="branch" id="branch" title="リポジトリ">…</span>
  <button id="reload" type="button" title="リポジトリの一覧と今の図を読み直す（pull やブランチの切り替えの後に）">↻ 読み直す</button>
  <div class="where"><span class="file" id="curFile">読み込み中…</span><span class="sub" id="curSub"></span></div>
  <span id="msg"></span>
  <div class="nav">
    <button id="prev" type="button" title="前の図へ（Ctrl+Shift+Enter）">← 前へ</button>
    <button id="skip" type="button" title="保存しないで次の図へ">保存せず次へ</button>
    <button id="saveOnly" type="button" title="この図のコードと PNG を書き込む（Ctrl+S）">保存<kbd>Ctrl+S</kbd></button>
    <button id="saveNext" class="primary" type="button" title="保存して次の図へ（Ctrl+Enter）">保存して次へ →<kbd>Ctrl+Enter</kbd></button>
  </div>
</header>

<aside>
  <button id="sideExpand" class="side-expand" type="button" aria-label="図の一覧を開く" title="図の一覧を開く">▶<span>図の一覧</span></button>
  <div class="side-head"><span>図の一覧</span><button id="sideCollapse" type="button" aria-label="図の一覧を折りたたむ" title="図の一覧を折りたたむ">◀ 折りたたむ</button></div>
  <div class="filters">
    <div class="row">
      <input id="q" type="search" placeholder="ファイル名・見出しで絞り込む" aria-label="絞り込み">
    </div>
    <span class="count" id="count"></span>
  </div>
  <div id="tree" role="navigation" aria-label="図の一覧"></div>
</aside>

<main>
  <div class="notice" id="notice"></div>
  <iframe id="snap" src="mermaid-snap.html?embed" title="図の編集"></iframe>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const frame = $("snap");
  const DONE_KEY = "mermaid-snap:workbench:done:v1"; // この回（ブランチごと）に保存した図
  const LAST_KEY = "mermaid-snap:workbench:last:v1";
  let pages = [], visible = [], current = null, dirty = false, busy = false, ready = false, branch = "";
  let done = {};
  const pending = {};

  function msg(text, cls) { $("msg").textContent = text || ""; $("msg").className = cls || ""; }
  const doneSet = () => (done[branch] = done[branch] || {});
  function saveDone() { try { localStorage.setItem(DONE_KEY, JSON.stringify(done)); } catch (e) {} }

  async function api(path, opt) {
    const r = await fetch(path, opt);
    const body = await r.json().catch(() => ({ ok: false, error: "サーバーの返事が読めません" }));
    if (!r.ok) throw new Error(body.error || ("HTTP " + r.status));
    return body;
  }

  // ---- 埋め込んだ mermaid-snap.html とのやりとり ----
  function ask(type, payload, replyType) {
    return new Promise((resolve, reject) => {
      pending[replyType] = { resolve, reject };
      frame.contentWindow.postMessage(Object.assign({ type }, payload || {}), location.origin);
      setTimeout(() => { if (pending[replyType]) { delete pending[replyType]; reject(new Error("編集画面が応答しません")); } }, 30000);
    });
  }
  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin || e.source !== frame.contentWindow || !e.data) return;
    const d = e.data;
    if (d.type === "snap:ready") { ready = true; start(); return; }
    if (d.type === "snap:dirty") { if (current && !busy) setDirty(true); return; }
    if (d.type === "snap:key") { if (d.key === "next") saveAndGo(1); else if (d.key === "prev") go(-1); else saveAndGo(0); return; }
    const p = pending[d.type];
    if (p) { delete pending[d.type]; p.resolve(d); }
  });

  function setDirty(on) {
    dirty = on;
    const b = document.querySelector(`.item[aria-current="true"] .mark`);
    if (b && current) b.replaceWith(markEl(current.id));
    document.title = (on ? "● " : "") + "Mermaid Snap ワークベンチ";
  }

  // ---- 一覧 ----
  const topDir = (f) => (f.includes("/") ? f.split("/")[0] : "（ルート）");
  function markEl(id) {
    const p = pages.find((x) => x.id === id);
    const s = document.createElement("span");
    s.className = "mark";
    if (current && current.id === id && dirty) { s.classList.add("dirty"); s.textContent = "●"; s.title = "保存していない変更"; }
    else if (doneSet()[id]) { s.classList.add("saved"); s.textContent = "✓"; s.title = "この回で保存した"; }
    else if (p && p.hasPng) { s.classList.add("png"); s.textContent = "▣"; s.title = "PNG あり"; }
    else { s.classList.add("none"); s.textContent = "○"; s.title = "PNG なし"; }
    return s;
  }

  function filtered() {
    const q = $("q").value.trim().toLowerCase();
    return pages.filter((p) => !q || (p.file + " " + p.heading).toLowerCase().includes(q));
  }

  // 一覧は、フォルダー → ファイル → 図 の木にする。ただし、
  //   ・中身がファイル 1 つだけのフォルダーは、フォルダーの段を作らずにファイルをそのまま並べる
  //   ・図が 1 つだけのファイルは、ファイルを開く段を作らずに、ファイル名の行を押すとその図を開く
  //   ・名前はその段の名前だけ（パスや .md は書かない）
  const baseName = (f) => f.split("/").pop().replace(/\.md$/i, "");
  function buildTree(list) {
    const root = { name: "", path: "", dirs: new Map(), files: new Map() };
    list.forEach((p) => {
      const parts = p.file.split("/");
      parts.pop();
      let node = root;
      parts.forEach((seg) => {
        if (!node.dirs.has(seg)) node.dirs.set(seg, { name: seg, path: node.path + seg + "/", dirs: new Map(), files: new Map() });
        node = node.dirs.get(seg);
      });
      if (!node.files.has(p.file)) node.files.set(p.file, []);
      node.files.get(p.file).push(p);
    });
    return root;
  }
  const countOf = (n) => [...n.dirs.values()].reduce((s, c) => s + countOf(c), 0) + [...n.files.values()].reduce((s, l) => s + l.length, 0);
  const indent = (el, depth, base) => { el.style.paddingLeft = (base + depth * 14) + "px"; };

  function renderTree() {
    visible = filtered();
    const tree = $("tree");
    const openKeys = new Set([...tree.querySelectorAll("details[open]")].map((d) => d.dataset.key));
    tree.textContent = "";
    const filtering = !!$("q").value.trim();
    const isCurrent = (p) => current && current.id === p.id;

    function itemEl(p, label, depth, title) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "item"; b.dataset.id = p.id;
      if (isCurrent(p)) b.setAttribute("aria-current", "true");
      const t = document.createElement("span"); t.className = "t";
      t.textContent = label;
      b.title = title;
      b.append(markEl(p.id), t);
      b.addEventListener("click", () => open(p.id));
      indent(b, depth, 8);
      return b;
    }
    function group(key, label, n, depth, cls) {
      const d = document.createElement("details");
      d.className = cls; d.dataset.key = key;
      const sm = document.createElement("summary");
      sm.textContent = label;
      const c = document.createElement("span"); c.className = "n"; c.textContent = String(n);
      sm.appendChild(c);
      indent(sm, depth, 8);
      d.appendChild(sm);
      if (openKeys.has(key) || filtering) d.open = true;
      return d;
    }
    // フォルダーの中身（フォルダーとファイル）を parent に並べる
    function renderDir(node, parent, depth) {
      for (const child of node.dirs.values()) {
        // 中身がファイル 1 つだけのフォルダーは段を作らない（フォルダーが 1 つだけのときは、どこのフォルダーか分からなくなるので段を残す）
        if (child.dirs.size === 0 && child.files.size === 1) { renderDir(child, parent, depth); continue; }
        const d = group("d:" + child.path, child.name, countOf(child), depth, "dir");
        renderDir(child, d, depth + 1);
        if (d.querySelector('.item[aria-current="true"]')) d.open = true;
        parent.appendChild(d);
      }
      for (const [file, list] of node.files) {
        if (list.length === 1) {
          parent.appendChild(itemEl(list[0], baseName(file), depth, `${file}${list[0].heading ? "　" + list[0].heading : ""}`));
          continue;
        }
        const d = group("f:" + file, baseName(file), list.length, depth, "file");
        d.querySelector("summary").title = file;
        list.forEach((p) => d.appendChild(itemEl(p, `${p.index}. ${p.heading || "（見出しなし）"}`, depth + 1, `${file} の ${p.index}/${p.count} 番目の図`)));
        if (d.querySelector('.item[aria-current="true"]')) d.open = true;
        parent.appendChild(d);
      }
    }
    renderDir(buildTree(visible), tree, 0);
    const saved = pages.filter((p) => doneSet()[p.id]).length;
    $("count").textContent = `${visible.length} / ${pages.length} 個の図を表示　この回で保存 ${saved} 個`;
    const cur = tree.querySelector('.item[aria-current="true"]');
    if (cur) cur.scrollIntoView({ block: "nearest" });
  }

  // ---- 開く・保存する・移る ----
  async function open(id, opt) {
    if (busy) return;
    if (dirty && !(opt && opt.force) && !confirm("保存していない変更があります。捨ててほかの図を開きますか？")) return;
    busy = true;
    msg("読み込み中…");
    try {
      const page = await api("/api/page?id=" + encodeURIComponent(id));
      current = page;
      const res = await ask("snap:load", { code: page.code, theme: page.theme || "default", scale: 1, layout: page.layout }, "snap:loaded");
      dirty = false;
      $("curFile").textContent = page.file;
      $("curSub").textContent = `図 ${page.index} / ${page.count}　${page.heading || ""}　→ ${page.png}${page.hasPng ? "" : "（まだ無い）"}`;
      const notes = [];
      if (page.layoutStale) notes.push("PNG を作った後に .md のコードが変わったので、PNG に入っていた手直し（線・位置）は戻していません。");
      if (page.hasPng && !page.layout && !page.layoutStale) notes.push("この PNG には手直しの情報が入っていません（ワークベンチより前に作った PNG）。保存すると今の図で書き直します。");
      if (!page.linked) notes.push("この図の下にはまだ画像がありません。保存すると .md の図の下に画像の行を足します。");
      $("notice").textContent = notes.join("　");
      $("notice").classList.toggle("show", notes.length > 0);
      location.replace("#" + encodeURIComponent(id));
      try { localStorage.setItem(LAST_KEY, id); } catch (e) {}
      msg(res.ok ? "" : "Mermaid の書き間違いがあります", res.ok ? "" : "bad");
      renderTree();
      updateNav();
    } catch (e) {
      msg(e.message, "bad");
    } finally {
      busy = false;
      document.title = "Mermaid Snap ワークベンチ";
    }
  }

  async function saveCurrent() {
    if (!current) return false;
    msg("保存中…");
    const ex = await ask("snap:export", {}, "snap:exported");
    if (!ex.ok) { msg("保存できません：" + ex.error, "bad"); return false; }
    const r = await api("/api/save", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: current.id, hash: current.hash, code: ex.code, png: ex.png, theme: ex.theme, layout: ex.layout })
    });
    current = r.page;
    const p = pages.find((x) => x.id === current.id);
    if (p) { p.hasPng = true; p.linked = true; }
    doneSet()[current.id] = Date.now(); saveDone();
    setDirty(false);
    msg(`保存しました（${r.mdChanged ? ".md と " : ""}${r.png}）`, "ok");
    return true;
  }

  function neighbor(step) {
    const list = visible.length ? visible : pages;
    const i = current ? list.findIndex((p) => p.id === current.id) : -1;
    return list[i + step] || null;
  }
  function updateNav() {
    $("prev").disabled = !neighbor(-1);
    $("skip").disabled = !neighbor(1);
    $("saveNext").disabled = !current;
    $("saveOnly").disabled = !current;
  }

  async function saveAndGo(step) {
    if (busy || !current) return;
    busy = true;
    let ok = false;
    try { ok = await saveCurrent(); } catch (e) { msg(e.message, "bad"); }
    finally { busy = false; }
    if (!ok || !step) { renderTree(); return; }
    const next = neighbor(step);
    if (next) open(next.id, { force: true });
    else { renderTree(); msg("最後の図まで保存しました", "ok"); }
  }
  function go(step) { const n = neighbor(step); if (n) open(n.id); }

  $("saveNext").addEventListener("click", () => saveAndGo(1));
  $("saveOnly").addEventListener("click", () => saveAndGo(0));
  $("skip").addEventListener("click", () => go(1));
  $("prev").addEventListener("click", () => go(-1));
  // サイドバーの折りたたみ。この端末に覚える
  const SIDE_KEY = "mermaid-snap:workbench:side-closed:v1";
  function setSide(closed) {
    document.body.classList.toggle("side-closed", closed);
    $("sideExpand").setAttribute("aria-expanded", String(!closed));
    try { localStorage.setItem(SIDE_KEY, closed ? "1" : ""); } catch (e) {}
  }
  $("sideCollapse").addEventListener("click", () => { setSide(true); $("sideExpand").focus(); });
  $("sideExpand").addEventListener("click", () => { setSide(false); const c = document.querySelector('.item[aria-current="true"]'); if (c) c.scrollIntoView({ block: "nearest" }); });
  try { setSide(localStorage.getItem(SIDE_KEY) === "1"); } catch (e) {}
  $("q").addEventListener("input", () => { renderTree(); updateNav(); });
  document.addEventListener("keydown", (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key === "Enter") { e.preventDefault(); if (e.shiftKey) go(-1); else saveAndGo(1); }
    else if (mod && (e.key === "s" || e.key === "S")) { e.preventDefault(); saveAndGo(0); }
    // 一覧や上のボタンを触った後も、Ctrl+Z／Ctrl+Y／Ctrl+Shift+Z を編集画面に渡す（絞り込みの入力欄の中では、そちらの取り消しを使う）
    else if (mod && !e.altKey && /^[zy]$/i.test(e.key) && !/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || "")) {
      e.preventDefault();
      const redo = e.key.toLowerCase() === "y" || e.shiftKey;
      frame.contentWindow.postMessage({ type: redo ? "snap:redo" : "snap:undo" }, location.origin);
    }
  });
  window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  // 一覧を読み直す。pull やブランチの切り替えの後は、今の図も読み直す（編集中なら確かめる）
  async function reloadList(opt) {
    if (busy) return;
    const quiet = opt && opt.quiet;
    try {
      const l = await api("/api/pages");
      const changed = l.branch !== branch;
      if (quiet && !changed) return;
      applyList(l);
      if (!current) return;
      const still = pages.find((p) => p.id === current.id);
      if (dirty) {
        msg(changed ? `ブランチが ${l.branch} に変わりました。今の変更は保存できないので、読み直してください` : "一覧を読み直しました（今の図は編集中なので読み直していません）", "warn");
        return;
      }
      await open(still ? still.id : (pages[0] && pages[0].id), { force: true });
      msg(changed ? `ブランチ ${l.branch} を読み直しました` : "読み直しました", "ok");
    } catch (e) { if (!quiet) msg(e.message, "bad"); }
  }
  function applyList(l) {
    listed = l;
    pages = l.pages;
    branch = l.branch || "";
    $("branch").textContent = branch ? "ブランチ " + branch : "ブランチ不明";
    $("branch").title = l.repo;
    renderTree();
    updateNav();
  }
  $("reload").addEventListener("click", () => {
    if (dirty && !confirm("保存していない変更があります。捨てて読み直しますか？")) return;
    dirty = false;
    reloadList();
  });
  // 画面に戻ってきたとき、ブランチが変わっていたら読み直す
  window.addEventListener("focus", () => reloadList({ quiet: true }));
  // アドレスの #<ページの ID> を変えたら、その図を開く
  window.addEventListener("hashchange", () => {
    const id = decodeURIComponent(location.hash.slice(1));
    if (id && (!current || id !== current.id) && pages.some((p) => p.id === id)) open(id);
  });

  let started = false, listed = null;
  async function start() {
    if (started || !ready || !listed) return;
    started = true;
    const want = decodeURIComponent(location.hash.slice(1)) || (() => { try { return localStorage.getItem(LAST_KEY); } catch (e) { return null; } })();
    const first = pages.find((p) => p.id === want) || pages.find((p) => topDir(p.file) !== "アーカイブ") || pages[0];
    if (first) open(first.id); else { $("curFile").textContent = "図が見つかりません"; updateNav(); }
  }

  (async () => {
    try { done = JSON.parse(localStorage.getItem(DONE_KEY) || "{}"); } catch (e) { done = {}; }
    try {
      applyList(await api("/api/pages"));
      start();
    } catch (e) {
      $("curFile").textContent = "一覧を読めません";
      msg(e.message + "（node serve.mjs で開いていますか？）", "bad");
    }
  })();
})();
</script>
