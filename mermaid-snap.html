<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>[hidden]{display:none!important} body{margin:0}</style>
</head>
<body>
<title>Mermaid Snap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 上部ツールバー＋左右2ペイン（左=コード、右=白い用紙のプレビュー）。狭い画面では上下に積む */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --fg: #1d2430;
  --muted: #5d6878;
  --line: #d5dbe3;
  --accent: #1f6feb;
  --accent-fg: #ffffff;
  --editor-bg: #fbfcfd;
  --err-bg: #fdecec;
  --err-fg: #a4161a;
  --ok: #2f8f5b;
  --paper: #ffffff;
  --font-ui: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a20; --panel: #1f242c; --fg: #e5e9ef; --muted: #9aa5b4; --line: #333b47;
    --accent: #4c8dff; --accent-fg: #0b1220; --editor-bg: #1a1f26; --err-bg: #3a1d20; --err-fg: #ffb3b3; --ok: #5fcf8e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a20; --panel: #1f242c; --fg: #e5e9ef; --muted: #9aa5b4; --line: #333b47;
  --accent: #4c8dff; --accent-fg: #0b1220; --editor-bg: #1a1f26; --err-bg: #3a1d20; --err-fg: #ffb3b3; --ok: #5fcf8e;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui);
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box; gap: 12px;
}
* { box-sizing: border-box; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: .02em; }
h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
button, select {
  font: inherit; font-size: 13px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel); color: var(--fg); padding: 6px 12px; cursor: pointer;
}
button:hover, select:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 500; }
.sync { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.sync.live { color: var(--ok); border-color: var(--ok); }
.sync.warn { color: var(--err-fg); border-color: var(--err-fg); }
label.opt { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 12px; }
main.collapsed { grid-template-columns: 40px minmax(0, 1fr); }
.head-btns { display: flex; gap: 6px; }
.expand { display: none; }
main.collapsed .code-pane > :not(.expand) { display: none !important; }
main.collapsed .expand {
  display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1;
  border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 12px 0; font-size: 12px;
}
main.collapsed .expand span { writing-mode: vertical-rl; letter-spacing: .2em; }
main.collapsed .expand:hover { color: var(--accent); }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.pane-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); letter-spacing: .06em; gap: 8px; }
#src {
  flex: 1; min-height: 0; resize: none; border: 0; padding: 12px; margin: 0;
  font-family: var(--font-code); font-size: 13px; line-height: 1.6;
  background: var(--editor-bg); color: var(--fg); tab-size: 4; font-variant-ligatures: none; white-space: pre; overflow: auto;
}
#src:focus-visible { outline: none; }
#err { display: none; margin: 0; padding: 8px 12px; background: var(--err-bg); color: var(--err-fg); font-family: var(--font-code); font-size: 12px; white-space: pre-wrap; max-height: 30%; overflow: auto; border-top: 1px solid var(--line); }
#err.show { display: block; }
.stage { flex: 1; min-height: 0; overflow: auto; background: var(--paper); display: flex; cursor: grab; touch-action: pinch-zoom; }
.stage.dragging { cursor: grabbing; user-select: none; }
.stage svg text { cursor: text; }
#inlineEdit {
  position: fixed; z-index: 15; font: 14px var(--font-ui); padding: 4px 8px;
  border: 2px solid var(--accent); border-radius: 4px; background: #fff; color: #1d2430;
  box-shadow: 0 4px 16px rgba(0,0,0,.18); outline: none; min-width: 140px;
  line-height: 1.5; resize: none; overflow-y: auto; white-space: pre-wrap; word-break: break-all; box-sizing: border-box;
}
#out { margin: auto; padding: 24px; }
#out svg { display: block; max-width: none !important; height: auto; }
#out.fit svg { max-width: 100% !important; }
/* 幅が足りないときは、ボタンの文字を折らずに、ボタンごと次の段へ送る */
.pane-head { flex-wrap: wrap; }
.pane-head > span { white-space: nowrap; }
.zoom { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; align-items: center; }
.zoom > *, .head-btns > *, .tools > *, label.opt { white-space: nowrap; flex: none; }
.zoom button { padding: 2px 8px; font-size: 12px; }
#status { font-size: 12px; color: var(--muted); min-height: 1em; }
#status.ok { color: var(--ok); }
#status.bad { color: var(--err-fg); }
/* 画像モーダル（コピーも保存もできない環境用） */
#modal { position: fixed; inset: 0; background: rgba(10,14,20,.6); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 20; }
#modal .box { background: var(--panel); border-radius: 8px; padding: 16px; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; gap: 12px; }
#modal[hidden] { display: none; }
#modal .box p { margin: 0; font-size: 13px; color: var(--muted); }
#modal .imgwrap { overflow: auto; background: #fff; border: 1px solid var(--line); }
#modal img { display: block; max-width: none; }
@media (max-width: 760px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(220px, 1fr) minmax(300px, 1.4fr); }
  main.collapsed { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(300px, 1fr); }
  main.collapsed .expand { flex-direction: row; justify-content: center; padding: 8px; }
  main.collapsed .expand span { writing-mode: horizontal-tb; }
  html, body { height: auto; min-height: 100%; }
  .tools { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* 線を手で描くモード */
.zoom .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.zoom button:disabled { opacity: .45; cursor: default; border-color: var(--line); }
.zoom button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.zoom select { padding: 2px 6px; font-size: 12px; }
.stage.draw-mode, .stage.draw-mode svg text { cursor: crosshair; }
.stage.draw-mode.near-edge, .stage.draw-mode.near-edge svg text { cursor: pointer; }
#out svg path.snap-edge-hover { stroke: #e8590c !important; }
#out svg path.snap-edge-dim { opacity: .25; }
#out svg text.snap-selected, #out svg text.snap-selected tspan { fill: #e8590c !important; }
#out svg rect.note.snap-selected { stroke: #e8590c !important; stroke-width: 2px !important; }
/* 線のラベルと多重度はドラッグで動かせる */
#out svg g.edgeLabel, #out svg g.edgeLabel text, #out svg g.edgeTerminals, #out svg g.edgeTerminals text { cursor: move; }
.stage.moving, .stage.moving svg text { cursor: grabbing; }
/* 表と枠もドラッグで動かせる。枠は右辺・下辺・右下の角で大きさを変える */
#out svg g.node, #out svg g.node text { cursor: move; }
.stage[data-handle="move"], .stage[data-handle="move"] svg text { cursor: move; }
.stage[data-handle="w"] { cursor: ew-resize; }
.stage[data-handle="h"] { cursor: ns-resize; }
.stage[data-handle="both"] { cursor: nwse-resize; }
</style>

<header>
  <h1>Mermaid Snap</h1>
  <span id="sync" class="sync" title="" hidden></span>
  <div class="tools">
    <label class="opt" for="theme">テーマ
      <select id="theme">
        <option value="default">default</option>
        <option value="neutral">neutral（白黒）</option>
        <option value="forest">forest</option>
        <option value="base">base</option>
      </select>
    </label>
    <label class="opt" for="scale">画質
      <select id="scale">
        <option value="2">2倍</option>
        <option value="3">3倍</option>
        <option value="1">等倍</option>
      </select>
    </label>
    <label class="opt" for="transparent"><input type="checkbox" id="transparent"> 背景透過</label>    <button class="primary" id="copyPng" type="button">PNGをコピー</button>
    <button id="savePng" type="button">PNG保存</button>
    <button id="saveSvg" type="button">SVG保存</button>
  </div>
</header>

<main>
  <section class="pane code-pane">
    <button id="expand" class="expand" type="button" aria-label="コード欄を開く" title="コード欄を開く">▶<span>コード</span></button>
    <div class="pane-head">
      <span>MERMAID コード</span>
      <div class="head-btns"><button id="clear" type="button">クリア</button><button id="collapse" type="button" aria-label="コード欄を折りたたむ" title="コード欄を折りたたむ">◀ 折りたたむ</button></div>
    </div>
    <textarea id="src" spellcheck="false" aria-label="Mermaidコード"></textarea>
    <pre id="err"></pre>
  </section>
  <section class="pane">
    <div class="pane-head">
      <span id="status">プレビュー</span>
      <div class="zoom">
        <button id="drawMode" type="button" aria-pressed="false" title="線の上から描き始めて、ドラッグで経路を描きます。放すと両端の箱につながり、なめらかな曲線に整えます。線をダブルクリックすると自動の経路に戻ります。">線を描く</button>
        <select id="smooth" aria-label="線の補正の強さ" title="線の補正の強さ">
          <option value="1">補正 1（弱）</option>
          <option value="2">補正 2</option>
          <option value="3" selected>補正 3</option>
          <option value="4">補正 4</option>
          <option value="5">補正 5（最強）</option>
        </select>
        <button id="undoRoute" type="button" title="線の変更を 1 つ戻します（Ctrl+Z）" disabled>↶ 戻す</button>
        <button id="redoRoute" type="button" title="戻した線の変更をやり直します（Ctrl+Y／Ctrl+Shift+Z）" disabled>↷ やり直す</button>
        <button id="resetRoutes" type="button" title="この図で手で描いた線と、動かしたラベル・多重度を、すべて自動の位置に戻します（Ctrl+Z で取り消せます）">線と位置をすべて戻す</button>
        <span class="sep"></span>
        <button id="alignCenter" type="button" title="図の文字をクリックして選び（Ctrl+クリックでまとめて選べます）、押すと選んだ文字だけを中央にそろえます。もう一度押すと元のそろえに戻します" disabled>中央ぞろえ</button>
        <span class="sep"></span>
        <button id="zoomOut" type="button" aria-label="縮小">−</button>
        <button id="zoomFit" type="button">全体表示</button>
        <button id="zoomIn" type="button" aria-label="拡大">＋</button>
      </div>
    </div>
    <div class="stage" id="stage" title="マウスホイールで拡大・縮小"><div id="out" class="fit"></div></div>
  </section>
</main>

<div id="modal" hidden>
  <div class="box">
    <p>この環境では直接コピー・保存ができませんでした。画像を右クリック（長押し）して「画像をコピー」または「名前を付けて保存」してください。</p>
    <div class="imgwrap"><img id="modalImg" alt="生成した図のPNG"></div>
    <button id="modalClose" type="button">閉じる</button>
  </div>
</div>

<script src="mermaid.min.js"></script>
<script>
(function () {
  const SAMPLE = `flowchart LR
    A[コードをコピー] --> B[左に貼り付け]
    B --> C{図が出た？}
    C -- はい --> D[PNGをコピー]
    C -- いいえ --> E[エラーを見て修正]
    E --> B
    D --> F[資料に貼る]`;
  const KEY = "mermaid-snap:v1";
  const FONT = '"Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", sans-serif';

  const $ = (id) => document.getElementById(id);
  const src = $("src"), out = $("out"), err = $("err"), status = $("status");
  let lastSvg = "", seq = 0, zoom = 0; // zoom 0 = fit
  // workbench.html に埋め込まれたとき（?embed）。コードは親が渡すので、この端末の保存には書かない
  const EMBED = new URLSearchParams(location.search).has("embed") && window.parent !== window;
  const notifyParent = (type, extra) => { if (EMBED) window.parent.postMessage(Object.assign({ type }, extra || {}), location.origin); };

  function load() {
    // コード欄は、最初は折りたたんでおく（開いた・閉じたは、単体で開いたときだけこの端末に覚える）
    setCollapsed(true);
    if (EMBED) { src.value = ""; document.querySelector("header h1").hidden = true; return; }
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || "{}");
      src.value = s.code || SAMPLE;
      if (s.theme) $("theme").value = s.theme;
      if (s.scale) $("scale").value = s.scale;
      $("transparent").checked = !!s.transparent;
      if (s.smooth) $("smooth").value = s.smooth;
      setCollapsed(!s.codeOpen); // 前の版の collapsed は読まない（前の版は、開いたままでも保存していたため）
    } catch (e) { src.value = SAMPLE; }
  }
  function setCollapsed(on) {
    document.querySelector("main").classList.toggle("collapsed", on);
    $("expand").setAttribute("aria-expanded", String(!on));
  }
  function save() {
    if (EMBED) return;
    try {
      localStorage.setItem(KEY, JSON.stringify({
        code: src.value, theme: $("theme").value, scale: $("scale").value, transparent: $("transparent").checked, smooth: $("smooth").value,
        codeOpen: !document.querySelector("main").classList.contains("collapsed")
      }));
    } catch (e) {}
  }

  // ```mermaid ... ``` で囲まれていたら中身だけ取り出す（Obsidian/VSCodeからのコピー対策）
  function clean(text) {
    let t = text.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n").replace(/[\u200B\u00A0]/g, " ");
    // 前後に説明文があっても ```mermaid ～ ``` の中身だけを取り出す（閉じがなくてもOK）
    const m = t.match(/^[ \t]*(`{3,}|~{3,})[ \t]*mermaid\b[^\n]*\n([\s\S]*?)(?:\n[ \t]*\1[ \t]*(?=\n|(?![\s\S]))|(?![\s\S]))/im);
    if (m) t = m[2];
    // 残ったフェンス行（``` / ```mermaid / ~~~）は捨てる
    t = t.split("\n").filter((l) => !/^\s*(`{3,}|~{3,})\s*(mermaid)?\s*$/i.test(l)).join("\n");
    // 全体が同じ幅で字下げされていたら取り除く
    const ind = t.split("\n").filter((l) => l.trim()).map((l) => l.match(/^[ \t]*/)[0].length);
    const min = ind.length ? Math.min(...ind) : 0;
    if (min) t = t.split("\n").map((l) => l.slice(min)).join("\n");
    return t;
  }

  function init() {
    mermaid.initialize({
      startOnLoad: false,
      theme: $("theme").value,
      securityLevel: "strict",
      fontFamily: FONT,
      htmlLabels: false,
      flowchart: { htmlLabels: false },
      themeVariables: { background: "#ffffff", fontFamily: FONT }
    });
  }

  function setStatus(text, cls) { status.textContent = text; status.className = cls || ""; }

  async function render() {
    const code = clean(src.value).trim();
    save();
    if (!code) { out.innerHTML = ""; lastSvg = ""; err.classList.remove("show"); setStatus("プレビュー"); return; }
    const id = "m" + (++seq);
    try {
      await mermaid.parse(code);
      const { svg } = await mermaid.render(id, code);
      if (id !== "m" + seq) return;
      out.innerHTML = svg;
      addLabelBackgrounds(out.querySelector("svg"));
      routes.prepare(out.querySelector("svg"), code);
      lastSvg = svg;
      applyZoom();
      err.classList.remove("show");
      setStatus("プレビュー");
    } catch (e) {
      document.getElementById("d" + id)?.remove();
      err.textContent = String(e && (e.message || e.str) || e).trim();
      err.classList.add("show");
      setStatus(lastSvg ? "エラー（直前の図を表示中）" : "エラー", "bad");
    }
  }

  // 矢印のラベルに背景を敷いて、線と文字が重ならないようにする
  function addLabelBackgrounds(svgEl) {
    if (!svgEl) return;
    svgEl.querySelectorAll("g.edgeLabel g.label").forEach((g) => {
      const text = g.querySelector("text");
      if (!text || !text.textContent.trim() || g.querySelector("rect.snap-label-bg")) return;
      const b = text.getBBox();
      if (!b.width) return;
      const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      r.setAttribute("class", "snap-label-bg");
      r.setAttribute("x", b.x - 4); r.setAttribute("y", b.y - 2);
      r.setAttribute("width", b.width + 8); r.setAttribute("height", b.height + 4);
      r.setAttribute("rx", 3);
      r.setAttribute("style", "fill:#ffffff;fill-opacity:0.9;opacity:1;stroke:none");
      g.insertBefore(r, g.firstChild);
    });
  }

  let t;
  function scheduleRender() { clearTimeout(t); t = setTimeout(render, 250); }

  function svgSize(svgEl) {
    const vb = svgEl.viewBox && svgEl.viewBox.baseVal;
    if (vb && vb.width) return { w: vb.width, h: vb.height };
    const r = svgEl.getBoundingClientRect();
    return { w: r.width, h: r.height };
  }

  function applyZoom() {
    const svgEl = out.querySelector("svg");
    if (!svgEl) return;
    // 「全体表示」：表示欄の幅に入る大きさを px で決める（元の大きさより大きくはしない）。
    // width="100%" のままだと、包む #out と互いの幅を待って決まらず、ブラウザーの既定の 300px になる
    if (zoom === 0) {
      out.classList.add("fit");
      const pad = parseFloat(getComputedStyle(out).paddingLeft) + parseFloat(getComputedStyle(out).paddingRight);
      const room = $("stage").clientWidth - pad;
      const w = svgSize(svgEl).w;
      svgEl.style.width = room > 0 && w ? Math.min(w, room) + "px" : "";
      return;
    }
    out.classList.remove("fit");
    svgEl.style.width = (svgSize(svgEl).w * zoom) + "px";
  }

  // 書き出し用のSVG文字列（サイズ明示＋背景）
  function exportSvg() {
    const svgEl = out.querySelector("svg");
    if (!svgEl) return null;
    const { w, h } = svgSize(svgEl);
    const clone = svgEl.cloneNode(true);
    // 線を描くモードの印（強調・描きかけの線）は書き出さない
    clone.querySelectorAll(".snap-preview").forEach((el) => el.remove());
    clone.querySelectorAll(".snap-edge-hover, .snap-edge-dim, .snap-selected").forEach((el) => el.classList.remove("snap-edge-hover", "snap-edge-dim", "snap-selected"));
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    clone.setAttribute("width", w);
    clone.setAttribute("height", h);
    clone.removeAttribute("style");
    if (!$("transparent").checked) {
      const vb = svgEl.viewBox.baseVal;
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", vb ? vb.x : 0); rect.setAttribute("y", vb ? vb.y : 0);
      rect.setAttribute("width", w); rect.setAttribute("height", h);
      rect.setAttribute("fill", "#ffffff");
      clone.insertBefore(rect, clone.firstChild);
    }
    return { text: new XMLSerializer().serializeToString(clone), w, h };
  }

  function pngBlob() {
    return new Promise((resolve, reject) => {
      const s = exportSvg();
      if (!s) return reject(new Error("図がありません"));
      const scale = Number($("scale").value) || 2;
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        c.width = Math.ceil(s.w * scale); c.height = Math.ceil(s.h * scale);
        const ctx = c.getContext("2d");
        if (!$("transparent").checked) { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); }
        ctx.drawImage(img, 0, 0, c.width, c.height);
        try {
          c.toBlob((b) => b ? resolve(b) : reject(new Error("PNG変換に失敗しました")), "image/png");
        } catch (e) { reject(e); }
      };
      img.onerror = () => reject(new Error("SVGの読み込みに失敗しました"));

  // 放すと、元の線の両端の箱の枠につなぎ、手ぶれを除いてなめらかな曲線に整える（ペイントソフトの線の補正のように）。
  // 描いた経路は、同じ図（コードとテーマが同じ）を開いたときに戻せるよう、この端末にだけ保存する。
  // 書き出し（PNG・SVG）は画面の SVG を写すので、描いた経路のまま出る。
  const ROUTES_KEY = "mermaid-snap:routes:v1";
  const SVGNS = "http://www.w3.org/2000/svg";
  // 補正の強さ：描いている間の追従の遅さ（0〜1。小さいほど強く補正）、ならす点の数、点を間引く距離（画面の px）
  //   max：曲線の途中の点の数の上限。超えるときは間引きを強めて、大きくゆるやかな曲線にする
  const SMOOTH = {
    1: { lazy: 0.6, avg: 1, eps: 1.5, max: Infinity },
    2: { lazy: 0.35, avg: 2, eps: 3, max: Infinity },
    3: { lazy: 0.2, avg: 4, eps: 6, max: 12 },
    4: { lazy: 0.1, avg: 8, eps: 12, max: 6 },
    5: { lazy: 0.05, avg: 14, eps: 22, max: 3 },
  };
  const NEAR_PX = 10;

  const routes = (() => {
    let diagramKey = "", svgEl = null, mode = false, stroke = null, hoverEdge = null, hoverRaf = 0;
    // 変更の履歴。1 回の操作 = [{ kind, key, from, to }]
    //   kind "route"：線の d の文字列（元の経路は null）
    //   kind "align"：文字を中央にそろえているか（true / false）
    let undoStack = [], redoStack = [], resetPending = false;
    // 次に描いたときに履歴を消す（別の図を読み込んだとき・コード欄に打ち込んだとき・テーマを変えたとき）
    function clearHistory() { resetPending = true; }
    // 図の上での文字の書き換え・削除（コードの変更）を、線や表の変更と同じ履歴に積む
    function pushCode(before, after) {
      if (before === after) return;
      undoStack.push([{ kind: "code", key: "code", from: before, to: after }]);
      if (undoStack.length > 200) undoStack.shift();
      redoStack = [];
      updateButtons();
    }
    // 選んでいる文字（text 要素）
    let selected = [];

    function hash(s) {
      let h = 0x811c9dc5;
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
      return (h >>> 0).toString(36);
    }
    function readAll() { try { return JSON.parse(localStorage.getItem(ROUTES_KEY) || "{}"); } catch (e) { return {}; } }
    function writeAll(all) { try { localStorage.setItem(ROUTES_KEY, JSON.stringify(all)); } catch (e) {} }
    const edges = () => svgEl ? [...svgEl.querySelectorAll("g.edgePaths path")].filter((p) => !p.classList.contains("snap-preview")) : [];
    // 描き直すたびに変わる図の番号（m1- など）を外した、線の名前
    const edgeKey = (p, i) => (p.id || "").replace(/^m\d+-/, "") || "edge-" + i;

    // 描き終えた図ごとに、元の経路を覚え、保存してある経路を戻す
    function prepare(el, code) {
      svgEl = el; stroke = null; hoverEdge = null; selected = [];
      if (!el) { updateButtons(); return; }
      const nextKey = hash($("theme").value + "\n" + code);
      // 履歴は、別の図を読み込んだときや、コード欄に打ち込んだとき（clearHistory）にだけ消す。
      // 図の上での文字の書き換え・削除でコードが変わったときは、その変更も履歴に入っているので残す
      if (resetPending) { undoStack = []; redoStack = []; resetPending = false; }
      diagramKey = nextKey;
      const saved = readAll()[diagramKey] || {};
      edges().forEach((p, i) => {
        p.dataset.snapOrig = p.getAttribute("d") || "";
        p.dataset.snapKey = edgeKey(p, i);
      });
      // 表・枠の元の位置と、線・ラベル・多重度がどの表につながっているかを、動かす前（Mermaid が描いたまま）の形で覚える
      layout.remember();
      edges().forEach((p) => { if (saved[p.dataset.snapKey]) p.setAttribute("d", saved[p.dataset.snapKey]); });
      Object.keys(saved).filter((k) => /^(node|cluster):/.test(k)).forEach((k) => layout.set(k, saved[k]));
      // 文字には、描くたびに同じになる順番で名前を付ける（同じコードなら同じ図になるため）
      el.querySelectorAll("text").forEach((t, i) => {
        t.dataset.snapKey = "text:" + i;
        if (saved[t.dataset.snapKey]) setAlign(t.dataset.snapKey, true);
      });
      // 線のラベルと多重度：元の位置を覚え、保存してある位置に動かす
      movables().forEach((g) => {
        const m = (g.getAttribute("transform") || "").match(/translate\(\s*(-?[\d.e+-]+)[\s,]+(-?[\d.e+-]+)\s*\)/);
        g.dataset.snapX0 = m ? m[1] : "0";
        g.dataset.snapY0 = m ? m[2] : "0";
        if (saved[g.dataset.snapKey]) setMove(g.dataset.snapKey, saved[g.dataset.snapKey]);
      });
      if (Object.keys(saved).length) fitViewBox();
      updateButtons();
    }

    // 線の d を変える。元の経路に戻すときは null
    function setD(key, d) {
      const p = edges().find((x) => x.dataset.snapKey === key);
      if (!p) return;
      p.setAttribute("d", d === null ? p.dataset.snapOrig : d);
      storeKey(key, d);
    }
    const current = (p) => (p.getAttribute("d") === p.dataset.snapOrig ? null : p.getAttribute("d"));

    // 文字を、入っている箱（なければ namespace の囲み）の中央にそろえる。on = false で元のそろえに戻す
    function setAlign(key, on) {
      const t = svgEl && svgEl.querySelector(`text[data-snap-key="${key}"]`);
      if (!t) return;
      const outer = [...t.querySelectorAll("tspan.text-outer-tspan")];
      const targets = outer.length ? outer : [t];
      if (t.dataset.snapAnchor0 === undefined) {
        t.dataset.snapAnchor0 = t.getAttribute("text-anchor") || "";
        targets.forEach((x) => { x.dataset.snapX0 = x.getAttribute("x") || ""; });
      }
      if (!on) {
        if (t.dataset.snapAnchor0) t.setAttribute("text-anchor", t.dataset.snapAnchor0); else t.removeAttribute("text-anchor");
        targets.forEach((x) => { if (x.dataset.snapX0) x.setAttribute("x", x.dataset.snapX0); else x.removeAttribute("x"); });
        delete t.dataset.snapCentered;
      } else {
        const box = t.closest("g.node") || t.closest("g.cluster") || t.parentNode;
        const r = box.getBoundingClientRect();
        const cx = new DOMPoint((r.left + r.right) / 2, r.top).matrixTransform(t.getScreenCTM().inverse()).x;
        t.setAttribute("text-anchor", "middle");
        targets.forEach((x) => x.setAttribute("x", String(Math.round(cx * 100) / 100)));
        t.dataset.snapCentered = "1";
      }
      storeKey(key, on ? true : null);
    }
    const isCentered = (t) => t.dataset.snapCentered === "1";

    // 線のラベル（g.edgeLabel）と多重度（g.edgeTerminals）。図の中の順番で名前を付ける
    function movables() {
      if (!svgEl) return [];
      const list = [];
      svgEl.querySelectorAll("g.edgeLabel").forEach((g, i) => { g.dataset.snapKey = "label:" + i; list.push(g); });
      svgEl.querySelectorAll("g.edgeTerminals").forEach((g, i) => { g.dataset.snapKey = "term:" + i; list.push(g); });
      return list;
    }
    // 元の位置からのずれ "dx,dy" で動かす。元の位置に戻すときは null
    function setMove(key, value) {
      const g = svgEl && svgEl.querySelector(`g[data-snap-key="${key}"]`);
      if (!g) return;
      const [dx, dy] = value ? value.split(",").map(Number) : [0, 0];
      g.setAttribute("transform", `translate(${Number(g.dataset.snapX0) + dx}, ${Number(g.dataset.snapY0) + dy})`);
      if (value) g.dataset.snapMoved = value; else delete g.dataset.snapMoved;
      storeKey(key, value);
    }
    const moved = (g) => g.dataset.snapMoved || null;
    // 押した所のラベル・多重度。多重度の文字は小さいので、周り 6px までならつかめるようにする
    function movableAt(e) {
      if (!svgEl) return null;
      const direct = e.target.closest && e.target.closest("g.edgeLabel, g.edgeTerminals");
      if (direct && svgEl.contains(direct) && direct.dataset.snapKey) return direct;
      const pad = 6;
      return [...svgEl.querySelectorAll("g.edgeLabel[data-snap-key], g.edgeTerminals[data-snap-key]")].find((g) => {
        const r = g.getBoundingClientRect();
        return r.width && e.clientX >= r.left - pad && e.clientX <= r.right + pad && e.clientY >= r.top - pad && e.clientY <= r.bottom + pad;
      }) || null;
    }

    function setState(c, value) {
      if (c.kind === "code") return setCode(value);
      if (c.kind === "align") setAlign(c.key, value);
      else if (c.kind === "move") setMove(c.key, value);
      else if (c.kind === "node" || c.kind === "cluster") layout.set(c.key, value);
      else setD(c.key, value);
    }

    // ---- 表（クラスの箱 g.node）と枠（namespace の g.cluster）を動かす ----
    // 表を動かすと、つながっている線は端を表と一緒に動かして形を保ち、ラベルは線の両端の動きの平均、多重度は表と同じだけ動く。
    // 枠を動かすと、中の表も一緒に動く。枠は右辺・下辺・右下の角をドラッグすると大きさを変えられる。
    const layout = (() => {
      const num = (s) => (s ? s.split(",").map(Number) : null);
      const fmt = (a) => (a.every((n) => Math.abs(n) < 0.005) ? null : a.map((n) => Math.round(n * 100) / 100).join(","));
      const nodes = () => (svgEl ? [...svgEl.querySelectorAll("g.node")] : []);
      const clusters = () => (svgEl ? [...svgEl.querySelectorAll("g.cluster")] : []);
      const byKey = (key) => svgEl && svgEl.querySelector(`[data-snap-key="${key}"]`);
      const center = (r) => ({ x: (r.left + r.right) / 2, y: (r.top + r.bottom) / 2 });
      const rectDistC = (r, pt) => Math.hypot(Math.max(r.left - pt.x, 0, pt.x - r.right), Math.max(r.top - pt.y, 0, pt.y - r.bottom));

      function remember() {
        nodes().forEach((g, i) => {
          g.dataset.snapKey = "node:" + i;
          const m = (g.getAttribute("transform") || "").match(/translate\(\s*(-?[\d.e+-]+)[\s,]+(-?[\d.e+-]+)\s*\)/);
          g.dataset.snapX0 = m ? m[1] : "0"; g.dataset.snapY0 = m ? m[2] : "0";
        });
        clusters().forEach((g, i) => {
          g.dataset.snapKey = "cluster:" + i;
          const r = g.querySelector(":scope > rect");
          if (r) ["x", "y", "width", "height"].forEach((a) => { r.dataset["snap0" + a] = r.getAttribute(a) || "0"; });
          const l = g.querySelector(":scope > g.cluster-label");
          const m = l && (l.getAttribute("transform") || "").match(/translate\(\s*(-?[\d.e+-]+)[\s,]+(-?[\d.e+-]+)\s*\)/);
          if (l) { l.dataset.snapX0 = m ? m[1] : "0"; l.dataset.snapY0 = m ? m[2] : "0"; }
        });
        // 線の両端がどの表につながっているか（元の線の始点・終点に一番近い表）
        const nodeRects = nodes().map((g) => ({ key: g.dataset.snapKey, r: g.getBoundingClientRect() }));
        const nearestNode = (pt) => nodeRects.reduce((b, n) => (!b || rectDistC(n.r, pt) < rectDistC(b.r, pt) ? n : b), null);
        const ends = [];
        edges().forEach((p) => {
          const len = p.getTotalLength();
          const a = toClient(p, p.getPointAtLength(0)), b = toClient(p, p.getPointAtLength(len));
          p.dataset.snapSrc = nearestNode(a)?.key || "";
          p.dataset.snapDst = nearestNode(b)?.key || "";
          ends.push({ pt: a, node: p.dataset.snapSrc }, { pt: b, node: p.dataset.snapDst });
          p._snapMid = toClient(p, p.getPointAtLength(len / 2));
        });
        // ラベルは一番近い線に、多重度は一番近い線の端の表に付ける
        movables();
        svgEl.querySelectorAll("g.edgeLabel").forEach((g) => {
          const c = center(g.getBoundingClientRect());
          let best = null, bd = Infinity;
          edges().forEach((p) => { const d = Math.hypot(p._snapMid.x - c.x, p._snapMid.y - c.y); if (d < bd) { bd = d; best = p; } });
          g.dataset.snapEdge = best ? best.dataset.snapKey : "";
        });
        svgEl.querySelectorAll("g.edgeTerminals").forEach((g) => {
          const c = center(g.getBoundingClientRect());
          const e = ends.reduce((b, x) => (!b || dist(x.pt, c) < dist(b.pt, c) ? x : b), null);
          g.dataset.snapNode = e ? e.node : "";
        });
      }

      // node: "dx,dy"、cluster: "dx,dy,dw,dh"。元に戻すときは null
      function set(key, value) {
        const g = byKey(key);
        if (!g) return;
        if (key.startsWith("node:")) {
          const [dx, dy] = num(value) || [0, 0];
          g.setAttribute("transform", `translate(${Number(g.dataset.snapX0) + dx}, ${Number(g.dataset.snapY0) + dy})`);
        } else {
          const [dx, dy, dw, dh] = num(value) || [0, 0, 0, 0];
          const r = g.querySelector(":scope > rect");
          if (r) {
            r.setAttribute("x", Number(r.dataset.snap0x) + dx);
            r.setAttribute("y", Number(r.dataset.snap0y) + dy);
            r.setAttribute("width", Math.max(20, Number(r.dataset.snap0width) + dw));
            r.setAttribute("height", Math.max(20, Number(r.dataset.snap0height) + dh));
          }
          const l = g.querySelector(":scope > g.cluster-label");
          if (l) l.setAttribute("transform", `translate(${Number(l.dataset.snapX0) + dx + dw / 2}, ${Number(l.dataset.snapY0) + dy})`);
        }
        if (value) g.dataset.snapLayout = value; else delete g.dataset.snapLayout;
        storeKey(key, value);
      }
      const get = (g) => g.dataset.snapLayout || null;

      // 線の形を、始点側を dA、終点側を dB だけ動かして保つ（途中は長さの割合でなめらかに混ぜる）
      function samples(p, d) {
        const tmp = document.createElementNS(SVGNS, "path");
        tmp.setAttribute("d", d);
        p.parentNode.appendChild(tmp);
        const len = tmp.getTotalLength();
        const n = Math.max(16, Math.min(200, Math.ceil(len / 6)));
        const pts = [];
        for (let i = 0; i <= n; i++) { const q = tmp.getPointAtLength(len * i / n); pts.push({ x: q.x, y: q.y, t: i / n }); }
        tmp.remove();
        return pts;
      }
      function deform(pts, dA, dB) {
        const moved = pts.map((q) => ({ x: q.x + dA.x * (1 - q.t) + dB.x * q.t, y: q.y + dA.y * (1 - q.t) + dB.y * q.t }));
        return curvePath(simplify(moved, 0.4));
      }
      // 表のずれ（"dx,dy"）を、線の座標のずれにする（図はすべて同じ座標系なのでそのまま）
      const nodeDelta = (key) => {
        const g = key && byKey(key);
        const v = g && num(get(g));
        return v ? { x: v[0], y: v[1] } : { x: 0, y: 0 };
      };
      // 自動の線（Mermaid の線）を、今の表の位置に合わせた形。表が動いていなければ null（元の線）
      function autoD(p) {
        const a = nodeDelta(p.dataset.snapSrc), b = nodeDelta(p.dataset.snapDst);
        if (!a.x && !a.y && !b.x && !b.y) return null;
        return deform(samples(p, p.dataset.snapOrig), a, b);
      }

      // ドラッグの始まり：何を動かすかと、動かす前の形を覚える
      function startDrag(kind, target, handle) {
        const movedNodes = new Set();
        if (kind === "node") movedNodes.add(target.dataset.snapKey);
        if (kind === "cluster" && handle === "move") {
          const cr = target.querySelector(":scope > rect").getBoundingClientRect();
          nodes().forEach((g) => {
            const c = center(g.getBoundingClientRect());
            if (c.x > cr.left && c.x < cr.right && c.y > cr.top && c.y < cr.bottom) movedNodes.add(g.dataset.snapKey);
          });
        }
        const es = edges().filter((p) => movedNodes.has(p.dataset.snapSrc) || movedNodes.has(p.dataset.snapDst)).map((p) => ({
          p, from: current(p), pts: samples(p, p.getAttribute("d")),
          wA: movedNodes.has(p.dataset.snapSrc) ? 1 : 0, wB: movedNodes.has(p.dataset.snapDst) ? 1 : 0,
        }));
        const ekeys = new Map(es.map((e) => [e.p.dataset.snapKey, e]));
        const labels = [...svgEl.querySelectorAll("g.edgeLabel")].filter((g) => ekeys.has(g.dataset.snapEdge)).map((g) => {
          const e = ekeys.get(g.dataset.snapEdge);
          return { g, from: moved(g), w: (e.wA + e.wB) / 2 };
        });
        const terms = [...svgEl.querySelectorAll("g.edgeTerminals")].filter((g) => movedNodes.has(g.dataset.snapNode)).map((g) => ({ g, from: moved(g), w: 1 }));
        return {
          kind, target, handle, from: get(target),
          nodes: [...movedNodes].filter((k) => !(kind === "node" && k !== target.dataset.snapKey)).map((k) => ({ g: byKey(k), from: get(byKey(k)) })),
          es, labels, terms,
        };
      }
      // ドラッグ中・終わりの形を計算する（d：ずれ、local の単位）
      function changesFor(s, d) {
        const out = [];
        const add = (a, b) => fmt(a.map((n, i) => n + (b[i] || 0)));
        if (s.kind === "cluster") {
          const base = num(s.from) || [0, 0, 0, 0];
          const delta = s.handle === "move" ? [d.x, d.y, 0, 0] : [0, 0, s.handle === "h" ? 0 : d.x, s.handle === "w" ? 0 : d.y];
          out.push({ kind: "cluster", key: s.target.dataset.snapKey, from: s.from, to: add(base, delta) });
        }
        if (s.kind === "node" || s.handle === "move") {
          s.nodes.forEach((n) => out.push({ kind: "node", key: n.g.dataset.snapKey, from: n.from, to: add(num(n.from) || [0, 0], [d.x, d.y]) }));
          s.es.forEach((e) => out.push({ kind: "route", key: e.p.dataset.snapKey, from: e.from, to: deform(e.pts, { x: d.x * e.wA, y: d.y * e.wA }, { x: d.x * e.wB, y: d.y * e.wB }) }));
          [...s.labels, ...s.terms].forEach((m) => out.push({ kind: "move", key: m.g.dataset.snapKey, from: m.from, to: add(num(m.from) || [0, 0], [d.x * m.w, d.y * m.w]) }));
        }
        return out;
      }

      // 押した所が枠のどこか（右下の角・右辺・下辺なら大きさ、上辺・左辺・名前なら移動）
      function clusterHandle(e) {
        const pad = 6;
        for (const g of clusters().reverse()) {
          const rr = g.querySelector(":scope > rect");
          if (!rr) continue;
          const r = rr.getBoundingClientRect();
          const x = e.clientX, y = e.clientY;
          const inY = y >= r.top - pad && y <= r.bottom + pad, inX = x >= r.left - pad && x <= r.right + pad;
          const nearR = Math.abs(x - r.right) <= pad && inY, nearB = Math.abs(y - r.bottom) <= pad && inX;
          const nearL = Math.abs(x - r.left) <= pad && inY, nearT = Math.abs(y - r.top) <= pad && inX;
          if (Math.abs(x - r.right) <= 12 && Math.abs(y - r.bottom) <= 12) return { g, handle: "both" };
          if (nearR) return { g, handle: "w" };
          if (nearB) return { g, handle: "h" };
          const label = g.querySelector(":scope > g.cluster-label");
          if (nearL || nearT || (label && label.contains(e.target))) return { g, handle: "move" };
        }
        return null;
      }

      return { remember, set, get, autoD, startDrag, changesFor, clusterHandle, nodes };
    })();
    // 1 回の操作として変え、履歴に積む。変わった数を返す
    function apply(changes) {
      changes = changes.filter((c) => c.from !== c.to);
      if (!changes.length) return 0;
      changes.forEach((c) => setState(c, c.to));
      undoStack.push(changes);
      if (undoStack.length > 200) undoStack.shift();
      redoStack = [];
      fitViewBox();
      updateButtons();
      return changes.length;
    }
    function undo() {
      const changes = undoStack.pop();
      if (!changes) return flash("戻す変更はありません");
      changes.forEach((c) => setState(c, c.from));
      redoStack.push(changes);
      fitViewBox();
      updateButtons();
      flash(`変更を 1 つ戻しました（あと ${undoStack.length} 回戻せます）`, "ok");
    }
    function redo() {
      const changes = redoStack.pop();
      if (!changes) return flash("やり直す変更はありません");
      changes.forEach((c) => setState(c, c.to));
      undoStack.push(changes);
      fitViewBox();
      updateButtons();
      flash("変更をやり直しました", "ok");
    }
    function updateButtons() {
      $("undoRoute").disabled = !undoStack.length;
      $("redoRoute").disabled = !redoStack.length;
      const b = $("alignCenter");
      b.disabled = !selected.length;
      b.textContent = selected.length && selected.every(isCentered) ? "中央ぞろえを解除" : "中央ぞろえ";
    }
    // 描いた線が元の図の範囲（viewBox）の外を通るときは、図の範囲を広げる。PNG の大きさもこれで決まる
    function fitViewBox() {
      if (!svgEl) return;
      if (!svgEl.dataset.snapViewBox) svgEl.dataset.snapViewBox = svgEl.getAttribute("viewBox") || "";
      const base = svgEl.dataset.snapViewBox.split(/[\s,]+/).map(Number);
      if (base.length !== 4 || base.some(isNaN)) return;
      let [x0, y0, x1, y1] = [base[0], base[1], base[0] + base[2], base[1] + base[3]];
      // 図の中身全体（線・表・枠・ラベル）が入るように広げる
      const content = svgEl.querySelector(":scope > g");
      if (content) {
        const b = content.getBBox(), pad = 8;
        if (b.width || b.height) {
          x0 = Math.min(x0, b.x - pad); y0 = Math.min(y0, b.y - pad);

          if (da < 1e-6) return { x: b.x + (c.x - b.x) / 3, y: b.y + (c.y - b.y) / 3 };

    // 描いた点を、元の線の始点の箱 → 描いた経路 → 終点の箱 の曲線に整える

    // 選んだ文字を Backspace／Delete で消す（コードからその文字を消す）。消すと図が書けなくなるときは消さない
    document.addEventListener("keydown", async (e) => {
      if ((e.key !== "Backspace" && e.key !== "Delete") || !selected.length || editing || stroke) return;

      const tag = (document.activeElement && document.activeElement.tagName) || "";

      const all = [];
      let missing = 0;
      const notes = new Set(); // 消す note の行（行の始まりの位置）
      const code0 = src.value;
      // 複数行の文字の 1 行だけを消すときは、上の行の終わりの改行（<br>）も消して、空の行を残さない。
      // 上の行が無い（1 行目を消す）ときは、下の行との間の <br> を消す
      const withBr = (r) => {
        const before = code0.slice(0, r.start).match(/[ \t]*<br\s*\/?>[ \t]*$/i);
        if (before) return { start: r.start - before[0].length, end: r.end };
        const after = code0.slice(r.end).match(/^[ \t]*<br\s*\/?>[ \t]*/i);

      const partOfFile = (r) => /[.(\/]/.test(code0[r.start - 1] || "") || /[.)\/]/.test(code0[r.end] || "");

      const fragmentLine = (t, r) => {
        const g = textGroup(t);

        const segs = [];
        const text = code0.slice(r.start, r.end), re = /\s*<br\s*\/?>\s*/gi;
        let last = 0, m;
        while ((m = re.exec(text))) { segs.push({ start: r.start + last, end: r.start + m.index }); last = m.index + m[0].length; }
        segs.push({ start: r.start + last, end: r.end });
        return segs.length === g.length ? segs[g.indexOf(t)] : r;
      };
      selected.forEach((t) => {
        const tg = findTarget(t);
        if (!tg) { missing++; return; }
        if (t.classList.contains("loopText")) tg.ranges = tg.ranges.map((r) => fragmentLine(t, r));
        const rs = tg.ranges.length > 1 ? tg.ranges.filter((r) => !partOfFile(r)) : tg.ranges;
        // note（Note over A,B: … や note for X "…"）は、文字だけでなく、その行を丸ごと消す
        all.push(...rs.map((r) => noteLine(code0, r) || withBr(r)));
        rs.forEach((r) => { const n = noteLine(code0, r); if (n) notes.add(n.start); });
      });
      // 重なる範囲・つながる範囲は 1 つにまとめる
      const ranges = [];
      all.sort((a, b) => a.start - b.start).forEach((r) => {
        const last = ranges[ranges.length - 1];
        if (last && r.start <= last.end) last.end = Math.max(last.end, r.end);
        else ranges.push({ start: r.start, end: r.end });
      });
      if (!ranges.length) return flash("選んだ文字はコードの中で見つかりませんでした", "bad");
      // 消した行に残った <br>（ラベルの始め・終わりにあるもの、二重のもの）も片付ける。片付けた分も消す範囲に足す
      const BR = /<br\s*\/?>/i;
      const lineStarts = new Set(ranges.map((r) => code0.lastIndexOf("\n", r.start - 1) + 1));
      const rest = (s, e) => {
        let line = code0.slice(s, e);
        ranges.filter((r) => r.start >= s && r.end <= e).sort((a, b) => b.start - a.start)
          .forEach((r) => { line = line.slice(0, r.start - s) + "\u0000".repeat(r.end - r.start) + line.slice(r.end - s); });
        return line;
      };
      lineStarts.forEach((s) => {
        let e = code0.indexOf("\n", s); if (e < 0) e = code0.length;
        const masked = rest(s, e); // 消す所を \0 にした行
        const re = /[ \t]*<br\s*\/?>[ \t]*/gi;
        let m;
        while ((m = re.exec(masked))) {
          const before = masked.slice(0, m.index).replace(/\u0000/g, "");
          const after = masked.slice(m.index + m[0].length).replace(/\u0000/g, "");
          // ラベルの終わり（行末・閉じかっこ・引用符の前）、ラベルの始め（: や as や開きかっこ・引用符の後）、次も <br> のとき
          const atEnd = /^\s*($|["'`\]\)\}|])/.test(after);
          const atStart = /(^|:|\bas|["'`\[\(\{|])\s*$/.test(before);
          const doubled = BR.test(after.slice(0, 12)) && /^\s*<br/i.test(after);
          if (atEnd || atStart || doubled) ranges.push({ start: s + m.index, end: s + m.index + m[0].length });
        }
      });
      ranges.sort((a, b) => a.start - b.start);
      for (let i = 1; i < ranges.length; i++) {
        if (ranges[i].start <= ranges[i - 1].end) { ranges[i - 1].end = Math.max(ranges[i - 1].end, ranges[i].end); ranges.splice(i--, 1); }
      }
      let next = src.value;
      [...ranges].sort((a, b) => b.start - a.start).forEach((r) => { next = next.slice(0, r.start) + next.slice(r.end); });
      try { await mermaid.parse(clean(next).trim()); }
      catch (ex) { return flash("この文字を消すと図が書けなくなるので、消しませんでした", "bad"); }
      const before = src.value;
      select([]);
      await replaceRanges(ranges, "");
      pushCode(before, src.value);
      flash(`${notes.size ? `note を ${notes.size} 個` :`${ranges.length} か所の文字を`}消しました（Ctrl+Z で戻せます）${missing ? `。${missing} か所はコードで見つからず残しました` : ""}`, "ok");
    });

    $("drawMode").addEventListener("click", () => setMode(!mode));
    $("undoRoute").addEventListener("click", undo);
    $("redoRoute").addEventListener("click", redo);
    $("smooth").addEventListener("change", save);
    $("resetRoutes").addEventListener("click", () => {
      if (!svgEl) return;
      const n = apply([
        ...edges().map((p) => ({ kind: "route", key: p.dataset.snapKey, from: current(p), to: null })),
        ...[...svgEl.querySelectorAll("g.node[data-snap-layout], g.cluster[data-snap-layout]")].map((g) => ({ kind: g.classList.contains("node") ? "node" : "cluster", key: g.dataset.snapKey, from: layout.get(g), to: null })),
        ...[...svgEl.querySelectorAll("g[data-snap-moved]")].map((g) => ({ kind: "move", key: g.dataset.snapKey, from: moved(g), to: null })),
      ]);
      if (!n) return flash("手で描いた線も、動かしたラベル・多重度もありません");
      flash(`${n} か所を自動の線と位置に戻しました（Ctrl+Z で取り消せます）`, "ok");
    });

    // 線のラベルと多重度をドラッグで動かす。放したら 1 回の操作として履歴に積む。ほとんど動かさなければクリック（文字を選ぶ）として扱う
    let moving = null;
    stage.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || !svgEl || stroke) return;
      const g = movableAt(e);
      if (!g) return;
      e.preventDefault(); e.stopImmediatePropagation();
      const inv = g.parentNode.getScreenCTM().inverse();
      const start = new DOMPoint(e.clientX, e.clientY).matrixTransform(inv);
      const [dx, dy] = moved(g) ? moved(g).split(",").map(Number) : [0, 0];
      moving = { id: e.pointerId, g, inv, start, dx, dy, from: moved(g), x: e.clientX, y: e.clientY, active: false };
      try { stage.setPointerCapture(e.pointerId); } catch (err) { /* 取れなくても動かせる */ }
    }, true);
    stage.addEventListener("pointermove", (e) => {
      if (!moving || e.pointerId !== moving.id) return;
      e.stopImmediatePropagation();
      if (!moving.active && Math.hypot(e.clientX - moving.x, e.clientY - moving.y) < 4) return;
      moving.active = true;
      stage.classList.add("moving");
      const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(moving.inv);
      const r = (n) => Math.round(n * 100) / 100;
      const nx = r(moving.dx + pt.x - moving.start.x), ny = r(moving.dy + pt.y - moving.start.y);
      moving.g.setAttribute("transform", `translate(${Number(moving.g.dataset.snapX0) + nx}, ${Number(moving.g.dataset.snapY0) + ny})`);
      moving.to = nx || ny ? `${nx},${ny}` : null;
    }, true);
    function endMove(e, cancel) {
      if (!moving || e.pointerId !== moving.id) return;
      e.stopImmediatePropagation();
      const m = moving;
      moving = null;
      stage.classList.remove("moving");
      if (!m.active) return; // クリックとして扱う（click で文字を選ぶ）
      down = null; // 動かしたあとの click で文字を選ばない
      if (cancel) { setMove(m.g.dataset.snapKey, m.from); return; }
      // 動かしている間の見た目は仮なので、いったん元に戻してから履歴に積む
      setMove(m.g.dataset.snapKey, m.from);
      if (apply([{ kind: "move", key: m.g.dataset.snapKey, from: m.from, to: m.to }])) {
        flash(`${m.g.classList.contains("edgeTerminals") ? "多重度" : "ラベル"}を動かしました（Ctrl+Z で戻せます）`, "ok");
      }
    }
    stage.addEventListener("pointerup", (e) => endMove(e, false), true);
    stage.addEventListener("pointercancel", (e) => endMove(e, true), true);

    // 表と枠をドラッグで動かす（枠は右辺・下辺・右下の角で大きさも変える）。ラベル・多重度の上で押したときは、上の処理が先に受け取る
    let dragBox = null;
    const showValues = (changes) => { silent = true; changes.forEach((c) => setState(c, c.to)); silent = false; };
    const restoreValues = (changes) => { silent = true; changes.forEach((c) => setState(c, c.from)); silent = false; };
    stage.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || !svgEl || stroke || moving) return;
      const node = e.target.closest && e.target.closest("g.node");
      const ch = node && svgEl.contains(node) ? null : layout.clusterHandle(e);
      if (!(node && svgEl.contains(node)) && !ch) return;
      e.preventDefault(); e.stopImmediatePropagation();
      const s = node ? layout.startDrag("node", node, "move") : layout.startDrag("cluster", ch.g, ch.handle);
      const inv = svgEl.querySelector(":scope > g").getScreenCTM().inverse();
      dragBox = { id: e.pointerId, s, inv, start: new DOMPoint(e.clientX, e.clientY).matrixTransform(inv), x: e.clientX, y: e.clientY, active: false, changes: [] };
      try { stage.setPointerCapture(e.pointerId); } catch (err) { /* 取れなくても動かせる */ }
    }, true);
    stage.addEventListener("pointermove", (e) => {
      if (dragBox && e.pointerId === dragBox.id) {
        e.stopImmediatePropagation();
        if (!dragBox.active && Math.hypot(e.clientX - dragBox.x, e.clientY - dragBox.y) < 4) return;
        dragBox.active = true;
        stage.classList.add("moving");
        const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(dragBox.inv);
        dragBox.changes = layout.changesFor(dragBox.s, { x: pt.x - dragBox.start.x, y: pt.y - dragBox.start.y });
        showValues(dragBox.changes);
        return;
      }
      // 枠の辺・角の上では、何ができるかをカーソルで示す
      if (!svgEl || moving || stroke || drag) return;
      const node = e.target.closest && e.target.closest("g.node");
      const ch = node ? null : layout.clusterHandle(e);
      stage.dataset.handle = ch ? ch.handle : "";
    }, true);
    function endBox(e, cancel) {
      if (!dragBox || e.pointerId !== dragBox.id) return;
      e.stopImmediatePropagation();
      const b = dragBox;
      dragBox = null;
      stage.classList.remove("moving");
      if (!b.active) return; // クリックとして扱う（click で文字を選ぶ）
      down = null;
      restoreValues(b.changes);
      if (cancel) return;
      const n = apply(b.changes);
      if (n) flash(`${b.s.kind === "node" ? "表" : b.s.handle === "move" ? "枠" : "枠の大きさ"}を変えました（Ctrl+Z で戻せます）`, "ok");
    }
    stage.addEventListener("pointerup", (e) => endBox(e, false), true);
    stage.addEventListener("pointercancel", (e) => endBox(e, true), true);

    return { prepare, importLayout, currentLayout, clearHistory, pushCode, undo, redo };
  })();

  $("zoomIn").addEventListener("click", () => zoomAt(1.25));
  $("zoomOut").addEventListener("click", () => zoomAt(0.8));
  $("zoomFit").addEventListener("click", () => { zoom = 0; applyZoom(); });

  $("theme").addEventListener("change", () => { routes.clearHistory(); init(); render(); shareChanged(); });
  $("scale").addEventListener("change", save);
  $("transparent").addEventListener("change", save);

  src.addEventListener("input", () => {
    // コード欄に打ち込んだときは、図の上での変更の履歴と合わなくなるので消す（コード欄の中の Ctrl+Z は今までどおり使える）
    if (!programmaticInput) routes.clearHistory();
    scheduleRender(); shareChanged(); notifyParent("snap:dirty");
  });
  src.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      e.preventDefault();
      const s = src.selectionStart, en = src.selectionEnd;
      src.value = src.value.slice(0, s) + "    " + src.value.slice(en);
      src.selectionStart = src.selectionEnd = s + 4;
      scheduleRender();
    }
  });

  load();
  if (!window.mermaid) {
    err.textContent = "Mermaidライブラリを読み込めませんでした。ネット接続を確認してページを再読み込みしてください。";
    err.classList.add("show");
    return;
  }
  init();
  // snap.mjs（CLI）から呼ばれたときは、図を書き出して結果を返すだけにする
  if (location.hash.startsWith("#job=")) { runJob(decodeURIComponent(location.hash.slice(5))); return; }
  if (EMBED) { startEmbed(); return; }
  render();
  startSharing();

  // ---- workbench.html から操作される口（postMessage） ----
  //   snap:load   { code, theme, scale, layout } → 描いて snap:loaded { ok, error }
  //   snap:export → snap:exported { ok, code, theme, layout, png（data URL）, error }
  //   こちらから：snap:dirty（コードか手直しが変わった）、snap:key（Ctrl+Enter など、親の操作のキー）
  function startEmbed() {
    const reply = (type, obj) => window.parent.postMessage(Object.assign({ type }, obj), location.origin);
    window.addEventListener("message", async (e) => {
      if (e.origin !== location.origin || e.source !== window.parent || !e.data) return;
      const d = e.data;
      try {
        if (d.type === "snap:load") {
          const theme = [...$("theme").options].some((o) => o.value === d.theme) ? d.theme : "default";
          $("theme").value = theme;
          const sc = String(d.scale || 1);
          if (![...$("scale").options].some((o) => o.value === sc)) $("scale").add(new Option(sc + "倍", sc));
          $("scale").value = sc;
          init();
          routes.importLayout(theme, clean(d.code || "").trim(), d.layout || null);
          routes.clearHistory();
          src.value = d.code || "";
          zoom = 0;
          await render();
          reply("snap:loaded", { ok: !err.classList.contains("show"), error: err.classList.contains("show") ? err.textContent : "" });
        } else if (d.type === "snap:undo") {
          routes.undo();
        } else if (d.type === "snap:redo") {
          routes.redo();
        } else if (d.type === "snap:export") {
          if (!lastSvg || err.classList.contains("show")) return reply("snap:exported", { ok: false, error: err.textContent || "図がありません" });
          const b = await pngBlob();
          const png = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
          reply("snap:exported", { ok: true, code: src.value, theme: $("theme").value, layout: routes.currentLayout(), png });
        }
      } catch (ex) {
        reply(d.type === "snap:load" ? "snap:loaded" : "snap:exported", { ok: false, error: String((ex && ex.message) || ex) });
      }
    });
    document.addEventListener("keydown", (e) => {
      const mod = e.ctrlKey || e.metaKey;
      if (mod && (e.key === "Enter" || e.key === "s" || e.key === "S")) {
        e.preventDefault();
        notifyParent("snap:key", { key: e.key === "Enter" ? (e.shiftKey ? "prev" : "next") : "save" });
      }
    }, true);
    notifyParent("snap:ready");
  }

  function runJob(jobUrl) {
    const box = document.createElement("pre");
    box.id = "snap-result";
    box.hidden = true;
    document.body.appendChild(box);
    const done = (obj) => { box.textContent = btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); };
    window.__snapJob = async (job) => {
      try {
        if (job.theme) {
          if (![...$("theme").options].some((o) => o.value === job.theme)) return done({ ok: false, error: "テーマ名が違います: " + job.theme });
          $("theme").value = job.theme;
          init();
        }
        const sc = String(job.scale || 2);
        if (![...$("scale").options].some((o) => o.value === sc)) $("scale").add(new Option(sc, sc));
        $("scale").value = sc;
        $("transparent").checked = !!job.transparent;
        src.value = job.code;
        await render();
        if (!lastSvg || err.classList.contains("show")) return done({ ok: false, error: err.textContent || "図を描けませんでした" });
        const res = { ok: true, svg: exportSvg().text, code: clean(src.value).trim() + "\n" };
        if (job.png) {
          const b = await pngBlob();
          res.png = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
        }
        done(res);
      } catch (e) {
        done({ ok: false, error: String((e && e.message) || e) });
      }
    };
    const tag = document.createElement("script");
    tag.src = jobUrl;
    tag.onerror = () => done({ ok: false, error: "ジョブファイルを読み込めませんでした" });
    document.head.appendChild(tag);
  }

  // ---- 共有（claude.ai のアーティファクト上でだけ動く。HTML単体ではこの端末のみ） ----
  function shareChanged() {} // 共有が始まったら差し替える
  function setSync(text, cls, title) {
    const el = $("sync");
    el.textContent = text;
    el.className = "sync" + (cls ? " " + cls : "");
    el.title = title || "";
  }
  async function startSharing() {
    if (!window.claude || typeof window.claude.use !== "function") return; // 単体HTML：その場限り
    let db = null;
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) return;
    const ref = db.doc("shared/diagram");
    const tab = Math.random().toString(36).slice(2);
    let shared = null;        // 最後に共有ストアと一致していた内容
    let ready = false, readOnly = false, writing = false, timer = 0, lastLocalEdit = 0;
    setSync("共有に接続中…");
    const loadTimer = setTimeout(() => setSync("共有に接続できません", "warn", "この端末の内容だけで動いています"), 10000);

    const current = () => ({ code: src.value, theme: $("theme").value });
    const same = (a, b) => a && b && a.code === b.code && a.theme === b.theme;

    function applyRemote(d) {
      const pos = [src.selectionStart, src.selectionEnd], top = src.scrollTop;
      if (typeof d.code === "string" && d.code !== src.value) {
        src.value = d.code;
        if (document.activeElement === src) src.setSelectionRange(Math.min(pos[0], d.code.length), Math.min(pos[1], d.code.length));
        src.scrollTop = top;
      }
      if (typeof d.theme === "string" && d.theme !== $("theme").value && [...$("theme").options].some((o) => o.value === d.theme)) {
        $("theme").value = d.theme;
        init();
      }
      render();
    }

    async function flush() {
      if (writing || readOnly || !ready) return;
      const now = current();
      if (same(now, shared)) return;
      writing = true;
      setSync("保存中…", "live");
      try {
        await ref.set({ code: now.code, theme: now.theme, by: tab, at: new Date().toISOString() });
        shared = now;
        setSync("共有中", "live", "アクセスした人と内容を共有しています");
      } catch (e) {
        if (e && (e.code === "invalid_argument" || e.code === "not_granted" || e.code === "revoked")) {
          readOnly = true;
          setSync("閲覧のみ", "warn", "編集はこの画面だけに反映され、共有されません");
        } else if (e && e.code === "quota_exceeded") {
          setSync("保存できません", "warn", "共有の保存容量がいっぱいです");
        } else {
          setSync("保存に失敗", "warn", "少し待ってからもう一度編集してください");
        }
      } finally {
        writing = false;
      }
      if (!readOnly && !same(current(), shared)) schedule();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(flush, 700); }
    shareChanged = function () { lastLocalEdit = Date.now(); if (ready) schedule(); };

    ref.onSnapshot((snap) => {
      if (!snap.metadata.fromCache) clearTimeout(loadTimer);
      if (snap.metadata.hasPendingWrites) return; // 自分の書き込み
      const d = snap.exists ? snap.data() : null;
      if (!ready) {
        if (snap.metadata.fromCache && !d) return;
        ready = true;
        if (d) { shared = { code: d.code, theme: d.theme }; applyRemote(d); }
        else { shared = { code: null, theme: null }; }
        setSync(readOnly ? "閲覧のみ" : "共有中", readOnly ? "warn" : "live", "アクセスした人と内容を共有しています");
        return;
      }
      if (!d || d.by === tab) { if (d) shared = { code: d.code, theme: d.theme }; return; }
      // 自分が打っている最中は上書きしない（自分の保存が後から勝つ）
      if (Date.now() - lastLocalEdit < 1500 || (!readOnly && (writing || !same(current(), shared)))) return;
      shared = { code: d.code, theme: d.theme };
      applyRemote(d);
    }, (e) => {
      clearTimeout(loadTimer);
      setSync("共有が切れました", "warn", "この端末の内容だけで動いています");
      shareChanged = function () {};
    });
  }
})();
</script>

</body>
</html>
